# ComplyMail SMTP Proxy configuration.
# Copy to config.yaml and adjust for your environment.

# Address the proxy listens on for inbound SMTP.
listen_addr: ":2525"

# The customer's real mail server to relay accepted mail to.
upstream:
  host: "mail.example.com"
  port: 25

# ComplyMail backend API used to scan outbound email.
backend:
  api_url: "http://api:8080"
  # Timeout in seconds for each scan request to the backend. Defaults to 5.
  timeout_seconds: 5

# Where flagged/redirected emails are rerouted for manual review. Optional —
# if unset, redirected emails are still header-stamped but delivered to
# their original recipients.
review:
  mailbox: "review@example.com"

# Address the metrics HTTP endpoint listens on. Defaults to ":2526".
metrics_addr: ":2526"
